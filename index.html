<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Binder</title>
<meta name="description" content="Offline Magic: The Gathering collection tracker. Scan a card with the camera, it goes in the binder.">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Binder">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/binder.css?v=20261018d">
</head>
<body>
<div class="app" id="app">
  <section class="screen on" id="v-loading"><div class="loading" aria-live="polite"><b>Binder</b><div id="ldmsg">Loading card index…</div><div class="bar"><i id="ldbar" style="width:3%"></i></div><div class="mu" id="ldsub" style="font-size:12px"></div></div></section>
  <section class="screen" id="v-search"></section>
  <section class="screen" id="v-scan"></section>
  <section class="screen" id="v-binder"></section>
  <section class="screen" id="v-decks"></section>
  <section class="screen" id="v-card"></section>
  <section class="screen" id="v-deck"></section>
  <section class="screen" id="v-review"></section>
  <section class="screen" id="v-sets"></section>
  <section class="screen" id="v-types"></section>
  <section class="screen" id="v-checklist"></section>
  <section class="screen" id="v-more"></section>
  <section class="screen" id="v-archetype"></section>
  <nav class="tabbar" id="tabbar" hidden aria-label="Sections"></nav>
</div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/vendor/tesseract.min.js?v=5.1.1"></script>
<script src="js/binder.js?v=20261018d"></script>
</body>
</html>
