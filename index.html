<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Binder</title>
<meta name="description" content="Offline Magic: The Gathering collection tracker. Scan a card with the camera, it goes in the binder.">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Binder">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <section class="screen on" id="v-loading"><div class="loading" aria-live="polite"><b>Binder</b><div id="ldmsg">Loading card index…</div><div class="bar"><i id="ldbar" style="width:3%"></i></div><div class="mu" id="ldsub" style="font-size:12px"></div></div></section>
  <section class="screen" id="v-search"></section>
  <section class="screen" id="v-scan"></section>
  <section class="screen" id="v-binder"></section>
  <section class="screen" id="v-decks"></section>
  <section class="screen" id="v-card"></section>
  <section class="screen" id="v-deck"></section>
  <section class="screen" id="v-review"></section>
  <section class="screen" id="v-more"></section>
  <nav class="tabbar" id="tabbar" hidden aria-label="Sections">
    <button data-tab="search" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>Search</span></button>
    <button data-tab="scan" aria-label="Scan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><rect x="8.5" y="7" width="7" height="10" rx="1"/></svg><span>Scan</span><span class="badge" id="rvbadge" hidden></span></button>
    <button data-tab="binder" aria-label="Binder"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></svg><span>Binder</span></button>
    <button data-tab="decks" aria-label="Decks"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="3.5" width="11" height="15" rx="1.5"/><path d="M4.5 7.5v11A1.5 1.5 0 0 0 6 20h10"/></svg><span>Decks</span></button>
    <button data-tab="more" aria-label="More"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="18" cy="12" r="1.3" fill="currentColor"/></svg><span>More</span></button>
  </nav>
</div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/vendor/tesseract.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
